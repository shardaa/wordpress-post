name: Update EliteBulletin Live IPO GMP Tracker

on:
  schedule:
    # Runs every 3 hours daily
    - cron: "0 */3 * * *"
  workflow_dispatch:

concurrency:
  group: update-elitebulletin-gmp
  cancel-in-progress: false

jobs:
  update-gmp:
    name: Scrape & Update Live IPO GMP Page
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create environment configuration
        env:
          ELITEBULLETIN_ENV: ${{ secrets.ELITEBULLETIN_ENV }}
        run: |
          if [ -z "$ELITEBULLETIN_ENV" ]; then
            echo "Missing ELITEBULLETIN_ENV secret"
            exit 1
          fi
          echo "$ELITEBULLETIN_ENV" | tr -d '\r' > elitebulletin.env

      - name: Update Live IPO GMP Tracker Page
        run: node scripts/update_ipo_gmp_page.mjs
