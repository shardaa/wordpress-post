name: Auto publish WordPress articles

on:
  schedule:
    # 6 times/day aligned with Indian market hours and peak search windows (IST = UTC + 5:30)
    # 02:30 UTC -> 08:00 AM IST (Pre-market morning opening GMP check)
    # 05:30 UTC -> 11:00 AM IST (Mid-morning subscription & GMP update)
    # 08:30 UTC -> 02:00 PM IST (Afternoon pre-closing bidding update)
    # 11:30 UTC -> 05:00 PM IST (Post-market day-end closing subscription summary)
    # 14:30 UTC -> 08:00 PM IST (Evening investor research & next-day watchlist)
    # 17:30 UTC -> 11:00 PM IST (Night wrap-up & allotment status checks)
    - cron: "30 2,5,8,11,14,17 * * *"
  workflow_dispatch:

concurrency:
  group: wordpress-auto-publisher
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ matrix.display_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - site: healingpoint
            display_name: HealingPoint
            content_mode: ""
          - site: kafirana
            display_name: Kafirana
            content_mode: "news"
          - site: elitebulletin
            display_name: Elite Bulletin
            content_mode: "ipo"
    env:
      HTTP_RETRY_ATTEMPTS: "8"
      HTTP_RETRY_DELAY_MS: "10000"

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Restore publisher state
        uses: actions/cache@v5
        with:
          path: |
            state
            output
          key: publisher-state-${{ matrix.site }}-${{ github.run_id }}
          restore-keys: |
            publisher-state-${{ matrix.site }}-

      - name: Create site env file
        env:
          SITE: ${{ matrix.site }}
          DISPLAY_NAME: ${{ matrix.display_name }}
          HEALINGPOINT_ENV: ${{ secrets.HEALINGPOINT_ENV }}
          KAFIRANA_ENV: ${{ secrets.KAFIRANA_ENV }}
          ELITEBULLETIN_ENV: ${{ secrets.ELITEBULLETIN_ENV }}
        run: |
          case "$SITE" in
            healingpoint)
              site_env="$HEALINGPOINT_ENV"
              ;;
            kafirana)
              site_env="$KAFIRANA_ENV"
              ;;
            elitebulletin)
              site_env="$ELITEBULLETIN_ENV"
              ;;
            *)
              echo "Unknown site: $SITE"
              exit 1
              ;;
          esac

          if [ -z "$site_env" ]; then
            echo "Missing GitHub secret for $DISPLAY_NAME"
            exit 1
          fi

          echo "$site_env" | tr -d '\r' > "$SITE.env"

      - name: Export runtime env
        env:
          SITE: ${{ matrix.site }}
          DISPLAY_NAME: ${{ matrix.display_name }}
        run: |
          node -e '
            const fs = require("fs");
            const envFile = process.env.SITE + ".env";
            let content = fs.readFileSync(envFile, "utf8");
            const lines = content.split(/\r?\n/);
            const envMap = {};
            for (const line of lines) {
              const idx = line.indexOf("=");
              if (idx !== -1 && !line.startsWith("#")) {
                const k = line.slice(0, idx).trim();
                const v = line.slice(idx + 1).trim().replace(/^["'\''']|["'\''']$/g, "");
                envMap[k] = v;
              }
            }
            let key = envMap.GEMINI_API_KEY || "";
            if (!key && envMap.GEMINI_API_KEYS) {
              key = envMap.GEMINI_API_KEYS.split(",")[0].trim();
            }
            if (key) {
              fs.appendFileSync(envFile, "\nGEMINI_API_KEY=" + key + "\n");
              fs.writeFileSync(".env", fs.readFileSync(envFile));
              console.log("::add-mask::" + key);
              fs.appendFileSync(process.env.GITHUB_ENV, "GEMINI_API_KEY=" + key + "\n");
              console.log("Successfully exported runtime GEMINI_API_KEY for " + process.env.DISPLAY_NAME);
            } else {
              console.error("Could not find GEMINI_API_KEY or GEMINI_API_KEYS in " + envFile);
              process.exit(1);
            }
          '

      - name: Fetch fresh IPO topics (EliteBulletin only)
        if: matrix.site == 'elitebulletin'
        run: node scripts/fetch_ipo_topics.mjs
        continue-on-error: true

      - name: Publish ${{ matrix.display_name }}
        env:
          BROWSER_HEADLESS: "true"
          RANDOM_TOPIC: "true"
          ARTICLE_LIMIT: "1"
          IMAGE_UPLOAD_ATTEMPTS: "1"
          CONTENT_MODE: ${{ matrix.content_mode }}
        run: node scripts/publish_articles.mjs --site=${{ matrix.site }} --research=browser
