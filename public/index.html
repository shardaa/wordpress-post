<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WordPress Auto Publisher</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(circle at 20% 20%, rgba(16, 185, 129, 0.18), transparent 26%),
          radial-gradient(circle at 80% 0%, rgba(59, 130, 246, 0.18), transparent 28%),
          linear-gradient(180deg, #060912 0%, #09111d 100%);
        color: #f5f7fb;
        overflow: hidden;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image: linear-gradient(rgba(39, 58, 74, 0.16) 1px, transparent 1px),
          linear-gradient(90deg, rgba(39, 58, 74, 0.12) 1px, transparent 1px);
        background-size: 100% 34px, 34px 100%;
        pointer-events: none;
        mask-image: radial-gradient(circle at center, black 55%, transparent 100%);
      }
      main {
        width: min(980px, calc(100vw - 32px));
        text-align: center;
        position: relative;
        z-index: 1;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 44px;
        line-height: 1.1;
        letter-spacing: 0;
      }
      p {
        margin: 0 0 24px;
        color: #b8c2d6;
        font-size: 16px;
      }
      .stack {
        display: flex;
        flex-direction: column;
        gap: 14px;
        align-items: center;
      }
      .control-row {
        width: 100%;
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 12px;
      }
      .topic-input {
        width: 100%;
        box-sizing: border-box;
        border: 1px solid #24546f;
        border-radius: 8px;
        background: rgba(8, 15, 28, 0.96);
        color: #e7eefb;
        padding: 14px 16px;
        font-size: 15px;
        outline: none;
      }
      .topic-input:focus {
        border-color: #3bc7ff;
        box-shadow: 0 0 0 3px rgba(59, 199, 255, 0.14);
      }
      .topic-box,
      .message-box {
        width: 100%;
        text-align: left;
        background: rgba(7, 14, 25, 0.9);
        border: 1px solid #1f3147;
        border-radius: 8px;
        padding: 18px;
        box-sizing: border-box;
        backdrop-filter: blur(10px);
        box-shadow: inset 0 1px 0 rgba(130, 202, 255, 0.08);
      }
      .topic-head,
      .message-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }
      .topic-title,
      .message-title {
        font-size: 14px;
        color: #9fb0d9;
        margin-bottom: 8px;
      }
      .topic-value {
        font-size: 18px;
        line-height: 1.5;
        color: #f5f7fb;
      }
      .subtle-button,
      .copy-button {
        appearance: none;
        border: 1px solid #24546f;
        border-radius: 8px;
        background: transparent;
        color: #d9e0f2;
        padding: 10px 14px;
        font-size: 14px;
        cursor: pointer;
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 8px;
        background: linear-gradient(90deg, #00c2ff 0%, #14b8a6 100%);
        color: white;
        padding: 14px 28px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        min-width: 180px;
      }
      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      .panel {
        margin-top: 18px;
        text-align: left;
        background: rgba(7, 14, 25, 0.95);
        border: 1px solid #174034;
        border-radius: 8px;
        padding: 18px;
        backdrop-filter: blur(10px);
        box-shadow: 0 0 0 1px rgba(28, 66, 48, 0.16), 0 20px 80px rgba(0, 0, 0, 0.35);
      }
      .row {
        margin-bottom: 10px;
        color: #d8def0;
      }
      pre {
        margin: 0;
        white-space: pre-wrap;
        word-break: break-word;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 13px;
        line-height: 1.5;
        color: #92f6c0;
        max-height: 420px;
        overflow: auto;
        text-align: left;
      }
      a { color: #a5b4fc; }
      .message-box.success {
        border-color: #1f8f5f;
      }
      .message-box.error {
        border-color: #b53b4e;
      }
      .message-meta {
        margin-top: 8px;
        color: #b8c2d6;
        font-size: 14px;
      }
      .message-actions {
        margin-top: 14px;
      }
      .terminal-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 12px;
        color: #8eb7c7;
        font-size: 13px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .terminal-title {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        display: inline-block;
      }
      .dot.red { background: #ff5f57; }
      .dot.yellow { background: #febc2e; }
      .dot.green { background: #28c840; }
      .terminal-shell {
        position: relative;
        border-radius: 8px;
        overflow: hidden;
      }
      .terminal-shell::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: 60px;
        background: linear-gradient(to bottom, rgba(32, 243, 174, 0.06), transparent);
        animation: scan 3.6s linear infinite;
        pointer-events: none;
      }
      .stage-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 14px;
      }
      .stage {
        border: 1px solid #27465f;
        border-radius: 999px;
        padding: 6px 10px;
        font-size: 12px;
        letter-spacing: 0;
        color: #8eb7c7;
        background: rgba(7, 14, 25, 0.8);
      }
      .stage.active {
        border-color: #20f3ae;
        color: #d7fff0;
        box-shadow: 0 0 0 1px rgba(32, 243, 174, 0.12);
      }
      .stage.done {
        border-color: #1f8f5f;
        color: #9ef0c6;
      }
      @keyframes scan {
        0% { transform: translateY(-70px); }
        100% { transform: translateY(420px); }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>WordPress Auto Publisher</h1>
      <p>One click to research the next topic, write the article, and publish it to WordPress.</p>
      <div class="stack">
        <section class="topic-box" id="topicBox">
          <div class="topic-head">
            <div>
              <div class="topic-title">Selected Topic</div>
              <div class="topic-value" id="selectedTopic">Loading topics...</div>
            </div>
            <button class="subtle-button" id="rotateTopicBtn" type="button">Rotate topic</button>
          </div>
        </section>

        <div class="control-row">
          <input
            class="topic-input"
            id="customTopicInput"
            type="text"
            placeholder="Or type a custom topic..."
            autocomplete="off"
          />
          <button class="subtle-button" id="useTypedTopicBtn" type="button">Use typed topic</button>
        </div>

        <button id="generateBtn">Generate</button>

        <section class="message-box" id="messageBox" hidden>
          <div class="message-head">
            <div>
              <div class="message-title" id="messageLabel">Status</div>
              <div class="topic-value" id="messageTitle">-</div>
            </div>
          </div>
          <div class="message-meta" id="messageMeta"></div>
          <div class="message-actions" id="messageActions"></div>
        </section>
      </div>

      <section class="panel" id="statusPanel" hidden>
        <div class="row"><strong>Status:</strong> <span id="statusText">Idle</span></div>
        <div class="row"><strong>Current Topic:</strong> <span id="topicText">-</span></div>
        <div class="row"><strong>Latest Post:</strong> <span id="postText">-</span></div>
      </section>

      <section class="panel" id="terminalPanel" hidden>
        <div class="terminal-header">
          <div class="terminal-title">
            <span class="dot red"></span>
            <span class="dot yellow"></span>
            <span class="dot green"></span>
            <span>publisher.run</span>
          </div>
          <span id="terminalMode">live</span>
        </div>
        <div class="stage-row" id="stageRow">
          <span class="stage" data-stage="topic">TOPIC</span>
          <span class="stage" data-stage="search">SEARCH</span>
          <span class="stage" data-stage="research">RESEARCH</span>
          <span class="stage" data-stage="write">WRITE</span>
          <span class="stage" data-stage="upload">UPLOAD</span>
          <span class="stage" data-stage="publish">PUBLISH</span>
        </div>
        <div class="terminal-shell">
          <pre id="logs"></pre>
        </div>
      </section>
    </main>

    <script type="module" src="/app.js"></script>
  </body>
  </html>
